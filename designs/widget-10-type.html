<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Type — типографическая таблица — Panax widget</title><style>
:root{color-scheme:dark;--bg:#111317;--ink:#f5f5f2;--muted:#92969e;--line:#30343c;--surface:#1b1e24;--accent:#f1a500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:#111317;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px;}
a{color:inherit}
.stage{width:100%;max-width:900px;margin:0 auto}
.widget{position:relative;overflow:hidden;width:100%;border-radius:22px;}
.kicker{font-size:10px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.game-title{font-size:clamp(27px,5vw,45px);font-weight:900;line-height:.98;letter-spacing:-.055em;margin:6px 0 8px}
.game-meta{font-size:12px;color:var(--muted);letter-spacing:.02em}
.rating-item{min-width:0}
.panax-link{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-weight:750;font-size:12px;white-space:nowrap;transition:transform .18s,opacity .18s}
.panax-link:hover{transform:translateY(-2px);opacity:.82}
.panax-link span{font-size:17px;line-height:1}
.r-icon{display:grid;place-items:center}
.r-name{font-weight:700}
.r-pct{font-variant-numeric:tabular-nums}
@media(max-width:540px){body{padding:14px}.widget{border-radius:17px}}


.typecard{padding:28px 32px;background:#faf9f5;color:#191919;border:1px solid #dedbd3;border-radius:0}.type-meta{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.16em;font-weight:900;color:#777}.type-hero{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 0 19px;border-bottom:7px solid #171717}.typecard .game-title{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(55px,11vw,100px);line-height:.75;letter-spacing:-.055em;margin:0}.typecard .game-title i{font-style:normal;color:#999}.type-aside{font-family:Georgia,serif;font-size:11px;line-height:1.4;text-align:right;font-weight:700}.type-aside span{display:block;font-family:Arial,sans-serif;color:#888;font-size:8px;margin-top:8px;letter-spacing:.16em}.type-rule{display:flex;justify-content:space-between;font-size:8px;font-weight:900;letter-spacing:.15em;color:#777;margin:16px 0 6px}.type-row{display:grid;grid-template-columns:32px 90px 1fr 75px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #dedbd3}.type-symbol{font-size:20px}.type-row>b{font-family:Georgia,serif;font-size:14px}.type-track{height:8px;background:#e9e7e1}.type-track i{display:block;height:100%;width:var(--v);background:var(--c)}.type-row strong{text-align:right;font-size:22px;letter-spacing:-.06em}.type-row small{font-size:10px}.type-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;color:#888;font-size:8px;font-weight:900;letter-spacing:.13em}.typecard .panax-link{background:#171717;color:white;padding:11px 14px;font-size:10px;letter-spacing:0}
@media(max-width:560px){.typecard{padding:20px}.type-hero{gap:10px}.typecard .game-title{font-size:55px}.type-aside{font-size:9px}.type-row{grid-template-columns:26px 67px 1fr 57px;gap:6px}.type-row>b{font-size:11px}.type-row strong{font-size:17px}.type-foot{align-items:flex-start;flex-direction:column}.type-meta{font-size:7px}}
</style></head>
<body><main class="stage"><article class="widget typecard">
 <div class="type-meta"><span>PANAX / GAME REACTION INDEX</span><span>2025 — № 025</span></div>
 <div class="type-hero"><div class="game-title">NEON<br><i>REQUIEM</i></div><div class="type-aside">VOIDLINE<br>STUDIO<br><span>ACTION RPG</span></div></div>
 <div class="type-rule"><span>КАК ИГРУ ВОСПРИНЯЛИ</span><span>100% ОТВЕТОВ</span></div>
 <div class="type-list"><div class="type-row" style="--c:#f3cb16;--v:19.6%"><span class="type-symbol">🏆</span><b>Легенда</b><div class="type-track"><i></i></div><strong>19.6<small>%</small></strong></div><div class="type-row" style="--c:#f2a000;--v:41.2%"><span class="type-symbol">🤘</span><b>Круто</b><div class="type-track"><i></i></div><strong>41.2<small>%</small></strong></div><div class="type-row" style="--c:#bd55e9;--v:37.3%"><span class="type-symbol">😄</span><b>Хорошо</b><div class="type-track"><i></i></div><strong>37.3<small>%</small></strong></div><div class="type-row" style="--c:#3c9df3;--v:0.0%"><span class="type-symbol">✋</span><b>Норм</b><div class="type-track"><i></i></div><strong>0.0<small>%</small></strong></div><div class="type-row" style="--c:#8ea6af;--v:2.0%"><span class="type-symbol">😞</span><b>Плохо</b><div class="type-track"><i></i></div><strong>2.0<small>%</small></strong></div><div class="type-row" style="--c:#e34d68;--v:0.0%"><span class="type-symbol">🤢</span><b>Ужас</b><div class="type-track"><i></i></div><strong>0.0<small>%</small></strong></div></div>
 <div class="type-foot"><span>МНЕНИЕ ИГРОКОВ — НЕ РЕЦЕНЗИЯ</span><a class="panax-link " href="YOUR_PANAX_GAME_URL" target="_blank" rel="noopener noreferrer">Оценки на Panax <span aria-hidden="true">↗</span></a></div>
</article></main></body></html>
