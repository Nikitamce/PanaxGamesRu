<!doctype html>

:root{color-scheme:dark;--bg:#111317;--ink:#f5f5f2;--muted:#92969e;--line:#30343c;--surface:#1b1e24;--accent:#f1a500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}

.r-icon{display:grid;place-items:center}
.r-name{font-weight:700}
.r-pct{font-variant-numeric:tabular-nums}

.editorial .kicker{color:#7b756b}.editorial .game-title{font-family:Georgia,serif;font-weight:900;letter-spacing:-.065em}.editorial .game-meta{color:#777167}.ed-top{display:grid;grid-template-columns:110px 1fr;gap:22px;border-bottom:1px solid #bdb8ae;padding-bottom:19px}.ed-index{font-family:Georgia,serif;font-size:10px;color:#79746a;letter-spacing:.09em;line-height:1.6}.ed-index b{display:block;font-size:21px;line-height:.9;color:#292722;margin-top:8px;letter-spacing:-.06em}
.ed-feature{padding:25px 0 18px;position:relative;z-index:1}.ed-feature-label{font-size:9px;font-weight:900;letter-spacing:.18em;color:#8b5e00}.ed-feature-main{display:flex;align-items:center;gap:14px;margin:6px 0}.ed-feature-main>span{font-size:38px}.ed-feature-main>b{font-family:Georgia,serif;font-size:clamp(24px,5vw,40px);letter-spacing:-.06em}.ed-feature-main>strong{font-size:clamp(44px,9vw,78px);letter-spacing:-.09em;color:#d78a00;margin-left:auto}.ed-feature-main small{font-size:.42em;letter-spacing:0}.ed-feature-note{font-family:Georgia,serif;font-size:13px;line-height:1.45;color:#716c63;margin-left:53px}
.ed-rest{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;border-top:1px solid #bdb8ae;padding-top:13px;position:relative;z-index:1}.ed-row{display:grid;grid-template-columns:20px 64px 1fr 42px;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #d0cbc1}.ed-row>span{font-size:15px}.ed-row b{font-family:Georgia,serif;font-size:11px}.ed-row i{height:4px;background:#cbc6bc;overflow:hidden}.ed-row em{display:block;height:100%;width:var(--v);background:var(--c)}.ed-row strong{font-size:11px;text-align:right}.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;color:#8b857b;font-size:8px;font-weight:900;letter-spacing:.15em;position:relative;z-index:1}.editorial .panax-link{background:#25231f;color:white;padding:10px 13px;font-family:Arial,sans-serif;letter-spacing:0;font-size:10px}
@media(max-width:600px){.editorial{padding:20px}.ed-top{grid-template-columns:70px 1fr;gap:12px}.ed-index b{font-size:16px}.ed-rest{grid-template-columns:1fr}.ed-feature-main{gap:8px}.ed-feature-note{margin-left:0}.ed-foot{align-items:flex-start;flex-direction:column}}
</style></head>
